<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinéma</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="poster-style"></div>

    <div class="landing-container">

        <div class="heading-cntnr">

            <div class="logo">
                <h5>Cinéma</h5>
            </div>

            <div class="title">
                <div class="discover-container">
                    <h1>Discover</h1>
                    <h1 class="cgItalic">any film.</h1>
                </div>

                <p>Posters · Cast · Ratings · More</p>
            </div>

        </div>

    

        <div class="search-cntnr">

            <div class="search-section">
                <input
                    type="text"
                    class="searchBar"
                    placeholder="Search a movie title..."
                    maxlength="40"
                >

                <button id="searchBtn">
                    SEARCH
                </button>
            </div>

            <p class="suggestionSpan">
                Try:
                <span class="suggestion">Inception</span>
                <span class="dot">·</span>
                <span class="suggestion">Dune</span>
                <span class="dot">·</span>
                <span class="suggestion">Interstellar</span>
            </p>

        </div>


        <div class="divider">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>

    
        <div class="discover-random">

            <p class="discover-heading">
                Discover by Genre
            </p>

            <div class="random-controls">

                <select id="genreSelect">
                    <option selected disabled>
                        Loading genres...
                    </option>
                </select>

                <select id="decadeSelect">
                    <option value="">Any Era</option>
                    <option value="1980">80s</option>
                    <option value="1990">90s</option>
                    <option value="2000">2000s</option>
                    <option value="2010">2010s</option>
                    <option value="2020">2020s</option>
                </select>

                <button id="randomBtn">
                    RANDOM FILM
                </button>

            </div>

        </div>

    </div>



    <div class="loading-screen hidden">

        <div class="loading-box">

            <div class="spinner"></div>

            <p>FETCHING</p>

        </div>

    </div>


    <div class="movie-container hidden">

        <div class="navbar">

            <button id="backBtn">
                ← BACK
            </button>

            <p class="navLogo">
                Cinéma
            </p>

            <p class="navText">
                OMDb
            </p>

        </div>

        <div class="movie-details">

       

            <div class="left-movie-detail">

                <div class="left-poster"></div>

                <div class="rating-box">

                    <span id="ratings">

                        <span>★ </span>

                        <span id="ratingSpan"></span>

                        <span class="rateStyles">
                            /10
                        </span>

                        <span
                            id="votingSpan"
                            class="rateStyles">
                        </span>

                    </span>

                </div>

            </div>

        

            <div class="right-movie-detail">

                <div class="movie-description">

                    <p id="genre"></p>

                    <p id="title"></p>

                    <p id="mini-details"></p>

                    <p id="description"></p>

                </div>

                <div class="display-grid">

                    <div class="display-cell">
                        <span>DIRECTOR</span>
                        <p id="director"></p>
                    </div>

                    <div class="display-cell">
                        <span>RELEASED</span>
                        <p id="released"></p>
                    </div>

                    <div class="display-cell">
                        <span>COUNTRY</span>
                        <p id="country"></p>
                    </div>

                    <div class="display-cell">
                        <span>LANGUAGE</span>
                        <p id="language"></p>
                    </div>

                    <div class="display-cell">
                        <span>WRITER</span>
                        <p id="writer"></p>
                    </div>

                    <div class="display-cell">
                        <span>ACTORS</span>
                        <p id="actors"></p>
                    </div>

                    <div class="display-cell">
                        <span>AWARDS</span>
                        <p id="awards"></p>
                    </div>

                    <div class="display-cell">
                        <span>BOX OFFICE</span>
                        <p id="box-office"></p>
                    </div>

                </div>

            </div>

        </div>

    </div>



    <script src="helpers.js"></script>
    <script src="script.js"></script>

</body>
</html>
